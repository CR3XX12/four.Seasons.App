<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Seasons QA · Run reports</title>
  <link rel="stylesheet" href="viewer.css">
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand-icon" aria-hidden="true">Q<span>✓</span></div><div><strong>Four Seasons QA</strong><span class="brand-sub">Android automation · Local reports</span></div><span class="local-badge">LOCAL EVIDENCE</span><button id="refresh" class="subtle">Refresh view</button></header>
  <div class="shell">
    <aside class="sidebar" aria-label="Run history">
      <div class="sidebar-heading"><h1>Run history</h1><span id="run-count" class="count"></span></div>
      <p class="muted small">Saved executions, newest first</p>
      <label class="search-label" for="search">Search tests or errors</label><input id="search" type="search" placeholder="Test ID, title, error…">
      <div class="status-filter" role="group" aria-label="Filter by result"><button data-status="ALL" class="active" aria-pressed="true">All</button><button data-status="FAIL" aria-pressed="false">Failed</button><button data-status="PASS" aria-pressed="false">Passed</button></div>
      <label class="search-label" for="test-filter">Test</label><select id="test-filter"><option value="">All tests</option></select>
      <label class="checkbox"><input id="latest-only" type="checkbox"> Latest run per test</label>
      <div id="run-list" class="run-list"></div>
      <footer class="sidebar-footer"><span id="generated"></span><p>Static snapshot. Regenerate with <code>npm.cmd run report</code>.</p></footer>
    </aside>
    <main id="main" tabindex="-1">
      <div class="page-heading"><div><span class="eyebrow">EXECUTION EVIDENCE</span><h2>Investigate a test run</h2></div><p class="muted">Inspect the failure, then follow its evidence.</p></div>
      <div id="summary" class="summary"></div>
      <div id="warnings"></div>
      <div id="run-detail"></div>
    </main>
  </div>
  <dialog id="image-dialog"><button id="close-dialog" class="dialog-close">Close image ✕</button><img id="dialog-image" alt="Expanded checkpoint screenshot"></dialog>
  <noscript>This report requires JavaScript to filter and display execution evidence.</noscript>
</body>
</html>
